# Social/link-preview crawlers send a Range header → Netlify answers 206 (partial),
# and crawlers won't parse a 206 (for HTML) or accept a partial image. The edge fn
# strips Range for crawler UAs so they get clean 200s. Covers the HTML + the og:image
# + the og:video. No effect on real visitors (videos keep Range/streaming for users).
[[edge_functions]]
  path = "/"
  function = "crawler-full"

[[edge_functions]]
  path = "/images/og/*"
  function = "crawler-full"

[[edge_functions]]
  path = "/videos/dsd-share-grid.mp4"
  function = "crawler-full"

# The Living Map (claude.ai artifact, COEP require-corp) streams the lounge + anthem from here.
# These headers only ALLOW cross-origin embedding of media — zero effect on the site itself.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

# THE FFC SOUNDTRACK MANIFEST (2026-07-31) — the ONE song list the FFC front desk
# and the DA inventory app both read at runtime. Short cache + revalidate so adding
# a song here reaches both apps on their next load, with no app redeploy.
# (/audio/* already opens CORS, which a fetch() needs and an <audio> tag does not.)
[[headers]]
  for = "/audio/soundtrack.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/media/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

# The Living Map's private door — unguessable path, never indexed, never cached stale
[[headers]]
  for = "/map/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache"

# Growth Partner boards — barehands glass boards for partner dentists, proxied to the VPS.
# The board server expects the /<slug> prefix intact on its side (Caddy handle_path strips
# it there), so /growthpartner/<slug>/<rest> forwards to
# https://srv1376990.hstgr.cloud/<slug>/<rest>.
#
# NOTE — no bare-path -> trailing-slash 301 here, deliberately. Netlify's edge normalizes
# URLs before matching redirects, so a rule `from = "/growthpartner/dremil"` ALSO matches
# "/growthpartner/dremil/" and 301s it to itself: an infinite loop that makes the board
# unreachable. Netlify documents this and says not to write slash-adding rules. The splat
# rule below already serves both forms; the canonical link to hand out is the slash form,
# which is what the board's own og:url declares.
[[redirects]]
  from = "/growthpartner/dremil/*"
  to = "https://srv1376990.hstgr.cloud/dremil/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/growthpartner/drfinn/*"
  to = "https://srv1376990.hstgr.cloud/drfinn/:splat"
  status = 200
  force = true
