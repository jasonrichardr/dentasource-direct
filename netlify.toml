# Social/link-preview crawlers send a Range header → Netlify answers 206 (partial),
# and crawlers won't parse a 206 (for HTML) or accept a partial image. The edge fn
# strips Range for crawler UAs so they get clean 200s. Covers the HTML + the og:image
# + the og:video. No effect on real visitors (videos keep Range/streaming for users).
[[edge_functions]]
  path = "/"
  function = "crawler-full"

[[edge_functions]]
  path = "/images/og/*"
  function = "crawler-full"

[[edge_functions]]
  path = "/videos/dsd-share-grid.mp4"
  function = "crawler-full"

# The Living Map (claude.ai artifact, COEP require-corp) streams the lounge + anthem from here.
# These headers only ALLOW cross-origin embedding of media — zero effect on the site itself.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/media/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
